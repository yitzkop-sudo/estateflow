<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payout Setup — EstateFlow</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0B1120; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#fff; }
    .card { text-align:center; padding:40px 28px; max-width:380px; }
    .icon { width:64px; height:64px; border-radius:18px; background:rgba(59,130,246,0.15); color:#60A5FA; font-size:26px; line-height:64px; margin:0 auto 18px; }
    h1 { font-size:20px; margin:0 0 8px; }
    p { color:#94A3B8; font-size:14px; line-height:1.6; margin:0; }
  </style>
  <script>
    // Stripe sends users back here when onboarding was left unfinished.
    setTimeout(function () { window.history.back(); }, 2500);
  </script>
</head>
<body>
  <div class="card">
    <div class="icon">&#8635;</div>
    <h1>Almost there…</h1>
    <p>Your payout setup wasn't finished yet. Redirecting you back to Stripe so you can continue where you left off.</p>
  </div>
</body>
</html>
