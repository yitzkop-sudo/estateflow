<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Complete — EstateFlow</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#060D1C; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#fff; }
    .card { text-align:center; padding:40px 28px; max-width:400px; }
    .icon { width:64px; height:64px; border-radius:18px; background:rgba(16,185,129,0.15); color:#10B981; font-size:30px; line-height:64px; margin:0 auto 18px; }
    .icon.cancel { background:rgba(251,191,36,0.15); color:#FBBF24; }
    h1 { font-size:20px; margin:0 0 8px; }
    p { color:#94A3B8; font-size:14px; line-height:1.6; margin:0 0 20px; }
    button { background:#10B981; color:#fff; border:none; border-radius:14px; padding:14px 28px; font-size:15px; font-weight:800; cursor:pointer; }
    button:active { opacity:0.85; }
    .hint { margin-top:14px; font-size:12px; color:#64748B; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">&#10003;</div>
    <h1 id="title">Auto-sync is on</h1>
    <p id="text">Payment successful. Return to the EstateFlow app — connecting your provider is waiting for you there.</p>
    <button id="back">Return to the app now</button>
    <p class="hint">Or just close this tab and go back to the app yourself.</p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      // Clean the URL so a refresh doesn't replay anything.
      window.history.replaceState({}, "", window.location.pathname);
      if (params.get("utility") === "canceled") {
        document.getElementById("icon").textContent = "!";
        document.getElementById("icon").classList.add("cancel");
        document.getElementById("title").textContent = "Payment canceled";
        document.getElementById("text").textContent = "No money was charged. Return to the EstateFlow app whenever you're ready.";
        document.title = "Payment Canceled — EstateFlow";
      }
      function goBack() {
        // Works when this tab was opened by the app (web popup flow) — the
        // app tab underneath has already advanced to the next step by itself.
        window.close();
      }
      document.getElementById("back").addEventListener("click", goBack);
      // Give them a moment to read, then close automatically if we can.
      setTimeout(goBack, 4000);
    })();
  </script>
</body>
</html>
